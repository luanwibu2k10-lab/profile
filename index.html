{% extends "base.html" %}
{% block content %}
<div class="text-center mb-5">
    <h1 class="fw-bold">CHỌN TỰA GAME NẠP THẺ</h1>
    <p class="text-muted">Giao dịch nhanh chóng - Uy tín - Tự động 100%</p>
</div>

<div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">
    {% for game in games %}
    <div class="col">
        <div class="card h-100 shadow-sm text-center">
            <div class="card-body">
                <h3 class="card-title fw-bold">{{ game.name }}</h3>
                <p class="text-muted">Nạp Quân Huy, Kim Cương, Gem giá rẻ.</p>
                <a href="/game/{{ game.id }}" class="btn btn-primary w-100">Nạp Ngay</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
