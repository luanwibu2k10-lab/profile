{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h2 class="text-center mb-3">Nạp Thẻ: {{ game.name }}</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nhập ID Nhân Vật / Tài khoản:</label>
                    <input type="text" name="player_id" class="form-control" required placeholder="Ví dụ: 12345678">
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Chọn Gói Nạp:</label>
                    <select name="package_id" class="form-select">
                        {% for pkg in packages %}
                        <option value="{{ pkg.id }}">{{ pkg.package_name }} - Giá: {{ pkg.price }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">XÁC NHẬN THANH TOÁN</button>
            </form>
            <div class="text-center mt-3">
                <a href="/" class="text-decoration-none">⬅ Quay lại trang chủ</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
